# 全局配置
settings:
  # 页面刷新间隔（秒）
  refresh_interval: 5

  # 是否自动连接所有启用的交易所
  auto_connect: false

  # WebSocket 重连配置
  websocket:
    reconnect_interval: 3
    max_reconnect_attempts: 5

  # 主题配置
  theme:
    default: "dark"
    available: ["dark", "light"]
