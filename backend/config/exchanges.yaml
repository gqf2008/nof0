    # 真实期货公司生产环境配置说明
    # ==========================================
    # 注意：以上都是仿真/测试环境，真实生产环境需要：
    # 1. 联系期货公司开通CTP交易权限
    # 2. 获取真实的 broker_id、app_id、auth_code
    # 3. 获取生产环境的服务器地址（通常不对外公开）
    # 4. 签署风险协议并完成实名认证
    #
    # 主要期货公司（需要联系开通）：
    # - 中信期货 (BrokerID: 66666)
    # - 国泰君安期货 (BrokerID: 1001)
    # - 银河期货 (BrokerID: 8888)
    # - 华泰期货 (BrokerID: 8888)
    # - 南华期货 (BrokerID: 8888)
    # - 光大期货 (BrokerID: 9999)
    # - 申银万国期货 (BrokerID: 8888)
    # - 广发期货 (BrokerID: 8888)
    # - 招商期货 (BrokerID: 9999)
    # - 中粮期货 (BrokerID: 6868)
    # - 永安期货 (BrokerID: 8888)
    # - 东证期货 (BrokerID: 8000)
    # - 方正中期期货 (BrokerID: 8080)
    # - 浙商期货 (BrokerID: 8888)
    # - 兴证期货 (BrokerID: 8200)
    #
    # 配置模板（真实环境示例）：
    # - name: "某期货公司-生产"
    #   broker_id: "实际BrokerID"
    #   app_id: "实际AppID"
    #   auth_code: "实际AuthCode"
    #   user_product_info: "产品名称"
    #   td_address: "tcp://生产服务器:端口"
    #   md_address: "tcp://行情服务器:端口"
    #   description: "生产环境"
    #   type: "production"

